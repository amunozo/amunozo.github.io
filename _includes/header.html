<header class="site-header">
  <div class="site-header__inner">
    <a href="{{ '/' | relative_url }}" class="site-brand">
      <span class="site-brand__name">Alberto Muñoz-Ortiz</span>
      <span class="site-brand__tag">NLP · Research Engineering</span>
    </a>
    <div class="site-header__meta">
      <nav class="site-nav" aria-label="Primary">
        <ul>
          {% for item in site.data.navigation.main %}
          <li><a href="{{ item.link | relative_url }}">{{ item.name }}</a></li>
          {% endfor %}
        </ul>
      </nav>
      <div class="site-actions" aria-label="Quick links">
        <a class="site-action site-action--primary" href="{{ '/assets/Alberto_Munoz_Ortiz_CV.pdf' | relative_url }}" target="_blank" rel="noopener noreferrer">CV</a>
        <a class="site-action" href="{{ '/research/' | relative_url }}">Publications</a>
        <a class="site-action" href="mailto:alberto.munoz.ortiz@proton.me">Contact</a>
      </div>
    </div>
  </div>
</header>
