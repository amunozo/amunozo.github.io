<svg width="200" height="1200" viewBox="0 0 200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!--
      Mudéjar zellige panel — proper 8-pointed star tessellation
      Based on Alhambra / Alcázar references from munira.net

      Palette (ceramic glazes):
        ivory   #EDE3CF   plaster ground / grout
        navy    #16264F   deep tile centers
        terra   #A04530   terracotta glazed
        emerald #1B6843   green glazed
        cobalt  #2656A0   blue glazed
        ochre   #C49420   gold accents
        brick   #8B3A2A   architectural frame
    -->

    <!-- ═══ 8-POINTED STAR ZELLIGE TILE (32×32) ═══
         Geometry: outer tips at r≈15, inner concavities at r≈9
         Decomposes into: 1 octagon + 4 cardinal kites + 4 diagonal kites
         Cross-shaped gaps form naturally between tiled stars -->
    <pattern id="zellige" patternUnits="userSpaceOnUse" width="32" height="32">
      <!-- Ivory ground (visible as cross gaps and grout) -->
      <rect width="32" height="32" fill="#EDE3CF"/>

      <!-- Deep navy central octagon -->
      <polygon points="24,13 19,8 13,8 8,13 8,19 13,24 19,24 24,19" fill="#16264F"/>

      <!-- Terracotta cardinal kites (N, E, S, W) -->
      <polygon points="19,8 16,1 13,8" fill="#A04530"/>
      <polygon points="24,19 31,16 24,13" fill="#A04530"/>
      <polygon points="13,24 16,31 19,24" fill="#A04530"/>
      <polygon points="8,13 1,16 8,19" fill="#A04530"/>

      <!-- Emerald diagonal kites (NE, NW, SE, SW) -->
      <polygon points="24,13 27,5 19,8" fill="#1B6843"/>
      <polygon points="13,8 5,5 8,13" fill="#1B6843"/>
      <polygon points="8,19 5,27 13,24" fill="#1B6843"/>
      <polygon points="19,24 27,27 24,19" fill="#1B6843"/>

      <!-- Ivory grout lines separating all tile pieces -->
      <path d="M31,16 L24,13 L27,5 L19,8 L16,1 L13,8 L5,5 L8,13 L1,16 L8,19 L5,27 L13,24 L16,31 L19,24 L27,27 L24,19 Z"
            fill="none" stroke="#EDE3CF" stroke-width="1.1" stroke-linejoin="miter"/>
      <polygon points="24,13 19,8 13,8 8,13 8,19 13,24 19,24 24,19"
               fill="none" stroke="#EDE3CF" stroke-width="0.9" stroke-linejoin="miter"/>

      <!-- Gold inner star accent inside octagon -->
      <polygon points="16,10 18,14 22,16 18,18 16,22 14,18 10,16 14,14" fill="#C49420"/>
      <polygon points="16,13 17,15 19,16 17,17 16,19 15,17 13,16 15,15" fill="#16264F"/>
    </pattern>

    <!-- ═══ ANGULAR KUFIC FRIEZE (40×44) ═══
         Cobalt letterforms on ivory, with terracotta caps and green accents -->
    <pattern id="kufic" patternUnits="userSpaceOnUse" width="40" height="44">
      <rect width="40" height="44" fill="#EDE3CF"/>
      <!-- Cobalt thick baseline -->
      <rect x="0" y="34" width="40" height="5" fill="#2656A0"/>
      <!-- Letter 1: tall alif -->
      <rect x="3" y="6" width="6" height="28" fill="#2656A0"/>
      <!-- Letter 2: short dal -->
      <rect x="15" y="16" width="6" height="18" fill="#2656A0"/>
      <!-- Letter 3: tall lam with hook -->
      <rect x="27" y="8" width="6" height="26" fill="#2656A0"/>
      <rect x="33" y="8" width="4" height="6" fill="#2656A0"/>
      <!-- Baseline connectors -->
      <rect x="9" y="28" width="6" height="6" fill="#2656A0"/>
      <rect x="21" y="28" width="6" height="6" fill="#2656A0"/>
      <!-- Terracotta caps -->
      <polygon points="3,6 6,2 9,6" fill="#A04530"/>
      <polygon points="27,8 30,4 33,8" fill="#A04530"/>
      <!-- Green marks -->
      <rect x="15" y="13" width="6" height="3" fill="#1B6843"/>
      <!-- Ochre diamond accents -->
      <polygon points="12,20 14,22 12,24 10,22" fill="#C49420"/>
      <polygon points="37,18 39,20 37,22 35,20" fill="#C49420"/>
    </pattern>

    <!-- ═══ DIAMOND CHAIN BORDER (10×10) ═══ -->
    <pattern id="chain" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#EDE3CF"/>
      <polygon points="5,0 10,5 5,10 0,5" fill="#2656A0"/>
      <polygon points="5,2 8,5 5,8 2,5" fill="#EDE3CF"/>
      <polygon points="5,3.5 6.5,5 5,6.5 3.5,5" fill="#C49420"/>
    </pattern>
  </defs>

  <!-- ═══════════ OUTER ARCHITECTURAL FRAME ═══════════ -->
  <rect x="5" y="5" width="190" height="1190" fill="#EDE3CF" stroke="#8B3A2A" stroke-width="4.2" stroke-linejoin="miter"/>
  <rect x="12" y="12" width="176" height="1176" fill="none" stroke="#2656A0" stroke-width="1.8" stroke-linejoin="miter"/>
  <rect x="16" y="16" width="168" height="1168" fill="none" stroke="#1B6843" stroke-width="1" stroke-linejoin="miter"/>

  <!-- ═══════════ TOP KUFIC FRIEZE ═══════════ -->
  <rect x="20" y="20" width="160" height="48" fill="url(#kufic)" stroke="#8B3A2A" stroke-width="1.4"/>

  <!-- ═══════════ TOP DIAMOND CHAIN ═══════════ -->
  <rect x="20" y="72" width="160" height="12" fill="url(#chain)" stroke="#A04530" stroke-width="1"/>

  <!-- ═══════════ MAIN ZELLIGE FIELD ═══════════ -->
  <rect x="20" y="88" width="160" height="1024" fill="url(#zellige)" stroke="#2656A0" stroke-width="1.8"/>
  <rect x="24" y="92" width="152" height="1016" fill="none" stroke="#8B3A2A" stroke-width="0.8"/>

  <!-- ═══════════ BOTTOM DIAMOND CHAIN ═══════════ -->
  <rect x="20" y="1116" width="160" height="12" fill="url(#chain)" stroke="#A04530" stroke-width="1"/>

  <!-- ═══════════ BOTTOM KUFIC FRIEZE ═══════════ -->
  <rect x="20" y="1132" width="160" height="48" fill="url(#kufic)" stroke="#8B3A2A" stroke-width="1.4"/>
</svg>
