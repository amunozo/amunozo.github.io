<svg width="160" height="1200" viewBox="0 0 160 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cohesive Mudéjar system inspired by the Munira references:
         - kufic-like angular interlace friezes
         - dense Nasrid-style zellij star field
         - terracotta / cobalt / emerald / ochre / ivory palette -->

    <!-- Angular kufic-style frieze (fits 112px exactly: 4 x 28) -->
    <pattern id="kufic-frieze" x="0" y="0" width="28" height="32" patternUnits="userSpaceOnUse">
      <rect width="28" height="32" fill="#F8F1E2"/>

      <!-- Terracotta stepped skeleton -->
      <path d="M2 25V8H10V21H18V9H26" fill="none" stroke="#8B3A2A" stroke-width="3.8" stroke-linejoin="miter"/>

      <!-- Cobalt baseline chain -->
      <path d="M0 19H8V30H18V19H28" fill="none" stroke="#1E4D8C" stroke-width="2.6" stroke-linejoin="miter"/>

      <!-- Emerald over-under link -->
      <path d="M4 4H14V13H24" fill="none" stroke="#1A6B4A" stroke-width="2.2" stroke-linejoin="miter"/>

      <!-- Ochre accents -->
      <circle cx="13" cy="16" r="1.5" fill="#B8780F"/>
      <circle cx="22" cy="12" r="1.5" fill="#B8780F"/>
    </pattern>

    <!-- Nasrid-like zellij field (fits main panel exactly: 4 x 36 tiles) -->
    <pattern id="zellij-field" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <!-- Cobalt glazed ground -->
      <rect width="28" height="28" fill="#2F79BE"/>

      <!-- Corner 4-point stars for continuity -->
      <path d="M0 0L2 2L0 4L-2 2Z" fill="#F8F1E2"/>
      <path d="M28 0L26 2L28 4L30 2Z" fill="#F8F1E2"/>
      <path d="M0 28L2 26L0 24L-2 26Z" fill="#F8F1E2"/>
      <path d="M28 28L26 26L28 24L30 26Z" fill="#F8F1E2"/>

      <!-- Outer white star frame -->
      <path d="M14 6L17 11L22 14L17 17L14 22L11 17L6 14L11 11Z" fill="#F8F1E2"/>

      <!-- Inner deep-blue star -->
      <path d="M14 9L16 12L19 14L16 16L14 19L12 16L9 14L12 12Z" fill="#1F3472"/>

      <!-- Cardinal petals (ochre) -->
      <path d="M14 0L18 7L14 9L10 7Z" fill="#D1A22E"/>
      <path d="M28 14L21 18L19 14L21 10Z" fill="#D1A22E"/>
      <path d="M14 28L10 21L14 19L18 21Z" fill="#D1A22E"/>
      <path d="M0 14L7 10L9 14L7 18Z" fill="#D1A22E"/>

      <!-- Diagonal petals (green and dusty rose) -->
      <path d="M21 5L26 10L22 12L18 8Z" fill="#2A7C4E"/>
      <path d="M7 5L10 8L6 12L2 10Z" fill="#B67D86"/>
      <path d="M21 23L18 20L22 16L26 18Z" fill="#B67D86"/>
      <path d="M7 23L2 18L6 16L10 20Z" fill="#2A7C4E"/>

      <!-- Fine grout-like separators -->
      <path d="M14 0V28M0 14H28" stroke="#F8F1E2" stroke-opacity="0.35" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Outer architectural frame -->
  <rect x="7" y="7" width="146" height="1186" fill="#F8F1E2" stroke="#8B3A2A" stroke-width="3.8"/>
  <rect x="14" y="14" width="132" height="1172" fill="none" stroke="#1E4D8C" stroke-width="1.6"/>
  <rect x="18" y="18" width="124" height="1164" fill="none" stroke="#1A6B4A" stroke-width="1"/>

  <!-- Top inscription-like frieze -->
  <rect x="24" y="24" width="112" height="64" fill="url(#kufic-frieze)" stroke="#8B3A2A" stroke-width="1.6"/>
  <line x1="24" y1="56" x2="136" y2="56" stroke="#B8780F" stroke-width="1.2"/>

  <!-- Main coherent zellij panel -->
  <rect x="24" y="96" width="112" height="1008" fill="url(#zellij-field)" stroke="#1E4D8C" stroke-width="1.8"/>
  <rect x="30" y="102" width="100" height="996" fill="none" stroke="#8B3A2A" stroke-width="1"/>

  <!-- Bottom inscription-like frieze -->
  <rect x="24" y="1112" width="112" height="64" fill="url(#kufic-frieze)" stroke="#8B3A2A" stroke-width="1.6"/>
  <line x1="24" y1="1144" x2="136" y2="1144" stroke="#B8780F" stroke-width="1.2"/>
</svg>
