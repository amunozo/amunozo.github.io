<svg width="160" height="1200" viewBox="0 0 160 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Mudéjar palette -->
    <!-- brick:#8B3A2A cobalt:#1E4D8C emerald:#1A6B4A ochre:#B8780F plum:#6E3548 ink:#2A1F1A cream:#FAF3E5 stucco:#F0E6D0 -->

    <!-- Pseudo-kufic frieze pattern (aligned 28-unit module) -->
    <pattern id="kufic" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#FAF3E5"/>
      <!-- Vertical ascenders -->
      <rect x="2" y="4" width="3" height="15" fill="#8B3A2A"/>
      <rect x="11" y="8" width="3" height="16" fill="#8B3A2A"/>
      <rect x="20" y="5" width="3" height="13" fill="#8B3A2A"/>
      <!-- Horizontal baseline -->
      <rect x="0" y="20" width="28" height="3" fill="#1E4D8C"/>
      <!-- Step connectors -->
      <rect x="5" y="16" width="6" height="3" fill="#8B3A2A"/>
      <rect x="14" y="14" width="6" height="3" fill="#8B3A2A"/>
      <!-- Small ornamental dots -->
      <circle cx="8" cy="12" r="1.4" fill="#B8780F"/>
      <circle cx="17" cy="10" r="1.4" fill="#B8780F"/>
    </pattern>

    <!-- Star-and-cross tile field (28x24 module fits 112x264 panel exactly) -->
    <pattern id="stars" x="0" y="0" width="28" height="24" patternUnits="userSpaceOnUse">
      <rect width="28" height="24" fill="#FAF3E5"/>
      <!-- 8-pointed star contained inside cell -->
      <path d="M14 2L17 8L24 9L18 13L20 20L14 16.5L8 20L10 13L4 9L11 8Z" fill="none" stroke="#1E4D8C" stroke-width="1.45"/>
      <!-- Inner star -->
      <path d="M14 6L16 10L20 10.5L17 13L18.2 17L14 15.2L9.8 17L11 13L8 10.5L12 10Z" fill="#B8780F" fill-opacity="0.88"/>
      <!-- Cross lines -->
      <line x1="0" y1="12" x2="28" y2="12" stroke="#1A6B4A" stroke-width="0.75" opacity="0.45"/>
      <line x1="14" y1="0" x2="14" y2="24" stroke="#1A6B4A" stroke-width="0.75" opacity="0.45"/>
      <!-- Corner knots -->
      <path d="M2 2L5 5M23 19L26 22M26 2L23 5M2 22L5 19" stroke="#6E3548" stroke-width="0.8" opacity="0.55"/>
      <circle cx="14" cy="12" r="2.1" fill="#2A1F1A"/>
    </pattern>

    <!-- Zigzag dado (16-unit module to align perfectly with 112px panels) -->
    <pattern id="zigzag" x="0" y="0" width="16" height="24" patternUnits="userSpaceOnUse">
      <rect width="16" height="24" fill="#FAF3E5"/>
      <path d="M0 18L4 8L8 18L12 8L16 18" stroke="#B8780F" stroke-width="2.2"/>
      <path d="M0 11L4 21L8 11L12 21L16 11" stroke="#1E4D8C" stroke-width="1.5"/>
      <circle cx="8" cy="14" r="1.1" fill="#8B3A2A"/>
    </pattern>

    <!-- Sebka net lozenge -->
    <pattern id="sebka" x="0" y="0" width="28" height="40" patternUnits="userSpaceOnUse">
      <rect width="28" height="40" fill="#FAF3E5"/>
      <path d="M14 0L28 20L14 40L0 20Z" fill="none" stroke="#8B3A2A" stroke-width="1.6"/>
      <path d="M14 8L22 20L14 32L6 20Z" fill="none" stroke="#1E4D8C" stroke-width="1.1"/>
      <circle cx="14" cy="20" r="2.2" fill="#B8780F"/>
    </pattern>
  </defs>

  <!-- ══════ OUTER FRAME ══════ -->
  <rect x="7" y="7" width="146" height="1186" fill="#FAF3E5" stroke="#8B3A2A" stroke-width="3.8"/>
  <rect x="14" y="14" width="132" height="1172" fill="none" stroke="#1E4D8C" stroke-width="1.5"/>
  <rect x="18" y="18" width="124" height="1164" fill="none" stroke="#1A6B4A" stroke-width="0.9"/>

  <!-- ══════ ZONE 1: Kufic frieze ══════ -->
  <rect x="24" y="22" width="112" height="52" fill="url(#kufic)" stroke="#8B3A2A" stroke-width="1.5"/>
  <line x1="24" y1="48" x2="136" y2="48" stroke="#B8780F" stroke-width="1.2"/>

  <!-- ══════ ZONE 2: Horseshoe arch panel ══════ -->
  <rect x="24" y="88" width="112" height="210" fill="#F0E6D0" stroke="#8B3A2A" stroke-width="2.2"/>
  <rect x="30" y="94" width="100" height="198" fill="none" stroke="#B8780F" stroke-width="1.5"/>
  <rect x="35" y="99" width="90" height="188" fill="#FAF3E5" stroke="#1E4D8C" stroke-width="1.3"/>

  <!-- Alfiz frame around the arch -->
  <rect x="42" y="140" width="76" height="146" fill="none" stroke="#2A1F1A" stroke-width="1.8"/>

  <!-- Horseshoe arch: wider above spring, narrows below -->
  <path d="M56 280V230C56 228 55 224 54 220C52 212 52 202 56 192C60 180 68 170 80 166C92 170 100 180 104 192C108 202 108 212 106 220C105 224 104 228 104 230V280"
        fill="none" stroke="#2A1F1A" stroke-width="2.6"/>
  <!-- Inner arch echo -->
  <path d="M62 280V234C62 230 61 226 60 222C58 214 58 206 62 196C65 186 72 178 80 174C88 178 95 186 98 196C102 206 102 214 100 222C99 226 98 230 98 234V280"
        fill="none" stroke="#6E3548" stroke-width="1.6"/>

  <!-- Spandrel arabesques (left) -->
  <path d="M46 148C52 154 56 162 55 172" stroke="#1A6B4A" stroke-width="1.5"/>
  <path d="M46 148C50 150 55 149 60 146" stroke="#1A6B4A" stroke-width="1.3"/>
  <path d="M48 156C54 158 58 156 62 152" stroke="#1A6B4A" stroke-width="1.1"/>
  <circle cx="48" cy="152" r="2.4" fill="#B8780F"/>
  <!-- Spandrel arabesques (right) -->
  <path d="M114 148C108 154 104 162 105 172" stroke="#1A6B4A" stroke-width="1.5"/>
  <path d="M114 148C110 150 105 149 100 146" stroke="#1A6B4A" stroke-width="1.3"/>
  <path d="M112 156C106 158 102 156 98 152" stroke="#1A6B4A" stroke-width="1.1"/>
  <circle cx="112" cy="152" r="2.4" fill="#B8780F"/>

  <!-- Star medallion inside arch -->
  <path d="M80 196L88 216L108 224L88 232L80 252L72 232L52 224L72 216Z" fill="#B8780F" fill-opacity="0.9" stroke="#1E4D8C" stroke-width="1.5"/>
  <path d="M80 206L84 218L96 222L84 226L80 238L76 226L64 222L76 218Z" fill="#FAF3E5" stroke="#8B3A2A" stroke-width="1"/>
  <circle cx="80" cy="222" r="4.5" fill="#2A1F1A"/>
  <circle cx="80" cy="222" r="2" fill="#B8780F"/>

  <!-- ══════ ZONE 3: Sebka net band ══════ -->
  <rect x="24" y="312" width="112" height="92" fill="url(#sebka)" stroke="#1E4D8C" stroke-width="1.5"/>
  <rect x="30" y="318" width="100" height="80" fill="none" stroke="#B8780F" stroke-width="1"/>
  <!-- Horizontal accent -->
  <line x1="30" y1="358" x2="130" y2="358" stroke="#8B3A2A" stroke-width="1.4"/>

  <!-- ══════ ZONE 4: Zigzag dado ══════ -->
  <rect x="24" y="416" width="112" height="100" fill="url(#zigzag)" stroke="#8B3A2A" stroke-width="1.5"/>
  <!-- Diamond cross overlay -->
  <path d="M46 448L80 480L114 448" stroke="#1A6B4A" stroke-width="2"/>
  <path d="M46 488L80 456L114 488" stroke="#1A6B4A" stroke-width="2"/>
  <circle cx="80" cy="468" r="9" fill="#FAF3E5" stroke="#2A1F1A" stroke-width="1.8"/>
  <circle cx="80" cy="468" r="3.8" fill="#8B3A2A"/>
  <circle cx="80" cy="468" r="1.5" fill="#B8780F"/>

  <!-- ══════ ZONE 5: Large star tile field ══════ -->
  <rect x="24" y="528" width="112" height="264" fill="url(#stars)" stroke="#8B3A2A" stroke-width="1.8"/>
  <rect x="30" y="534" width="100" height="252" fill="none" stroke="#1A6B4A" stroke-width="1.2"/>
  <!-- Register dividers -->
  <line x1="30" y1="588" x2="130" y2="588" stroke="#B8780F" stroke-width="1.1" opacity="0.7"/>
  <line x1="30" y1="654" x2="130" y2="654" stroke="#B8780F" stroke-width="1.1" opacity="0.7"/>
  <line x1="30" y1="720" x2="130" y2="720" stroke="#B8780F" stroke-width="1.1" opacity="0.7"/>
  <!-- Central rosette accents -->
  <circle cx="80" cy="558" r="12" fill="#FAF3E5" stroke="#1E4D8C" stroke-width="1.8"/>
  <path d="M80 550L83 554L88 554L84 558L86 562L80 560L74 562L76 558L72 554L77 554Z" fill="#8B3A2A"/>
  <circle cx="80" cy="558" r="3" fill="#B8780F"/>

  <circle cx="80" cy="690" r="12" fill="#FAF3E5" stroke="#6E3548" stroke-width="1.8"/>
  <path d="M80 682L83 686L88 686L84 690L86 694L80 692L74 694L76 690L72 686L77 686Z" fill="#1A6B4A"/>
  <circle cx="80" cy="690" r="3" fill="#B8780F"/>

  <!-- ══════ ZONE 6: Second horseshoe arch panel ══════ -->
  <rect x="24" y="806" width="112" height="196" fill="#F0E6D0" stroke="#8B3A2A" stroke-width="2.2"/>
  <rect x="30" y="812" width="100" height="184" fill="none" stroke="#B8780F" stroke-width="1.5"/>
  <rect x="35" y="817" width="90" height="174" fill="#FAF3E5" stroke="#1A6B4A" stroke-width="1.3"/>

  <!-- Alfiz frame -->
  <rect x="42" y="850" width="76" height="136" fill="none" stroke="#2A1F1A" stroke-width="1.8"/>

  <!-- Horseshoe arch (cobalt variant) -->
  <path d="M56 980V936C56 934 55 930 54 926C52 918 52 910 56 900C60 890 68 882 80 878C92 882 100 890 104 900C108 910 108 918 106 926C105 930 104 934 104 936V980"
        fill="none" stroke="#2A1F1A" stroke-width="2.6"/>
  <path d="M62 980V940C62 936 61 932 60 928C58 920 58 914 62 904C65 896 72 888 80 884C88 888 95 896 98 904C102 914 102 920 100 928C99 932 98 936 98 940V980"
        fill="none" stroke="#1E4D8C" stroke-width="1.6"/>

  <!-- Spandrels -->
  <path d="M46 856C52 862 56 870 55 880" stroke="#1A6B4A" stroke-width="1.5"/>
  <path d="M46 856C50 858 55 857 60 854" stroke="#1A6B4A" stroke-width="1.3"/>
  <path d="M48 864C54 866 58 864 62 860" stroke="#1A6B4A" stroke-width="1.1"/>
  <circle cx="49" cy="860" r="2.2" fill="#B8780F"/>
  <path d="M114 856C108 862 104 870 105 880" stroke="#1A6B4A" stroke-width="1.5"/>
  <path d="M114 856C110 858 105 857 100 854" stroke="#1A6B4A" stroke-width="1.3"/>
  <path d="M112 864C106 866 102 864 98 860" stroke="#1A6B4A" stroke-width="1.1"/>
  <circle cx="111" cy="860" r="2.2" fill="#B8780F"/>

  <!-- Star medallion (cobalt) -->
  <path d="M80 902L87 918L104 924L87 930L80 946L73 930L56 924L73 918Z" fill="#1E4D8C" fill-opacity="0.92" stroke="#B8780F" stroke-width="1.4"/>
  <path d="M80 910L83 920L93 923L83 926L80 936L77 926L67 923L77 920Z" fill="#FAF3E5" stroke="#8B3A2A" stroke-width="0.9"/>
  <circle cx="80" cy="923" r="4" fill="#B8780F"/>
  <circle cx="80" cy="923" r="1.6" fill="#2A1F1A"/>

  <!-- ══════ ZONE 7: Bottom composite register ══════ -->
  <!-- Kufic sub-band -->
  <rect x="24" y="1016" width="112" height="48" fill="url(#kufic)" stroke="#8B3A2A" stroke-width="1.5"/>
  <line x1="24" y1="1040" x2="136" y2="1040" stroke="#B8780F" stroke-width="1.1"/>

  <!-- Zigzag sub-band -->
  <rect x="24" y="1070" width="112" height="52" fill="url(#zigzag)" stroke="#1E4D8C" stroke-width="1.4"/>

  <!-- Closing stepped lines -->
  <line x1="32" y1="1138" x2="128" y2="1138" stroke="#2A1F1A" stroke-width="2"/>
  <line x1="40" y1="1150" x2="120" y2="1150" stroke="#8B3A2A" stroke-width="1.6"/>
  <line x1="48" y1="1160" x2="112" y2="1160" stroke="#B8780F" stroke-width="1.3"/>
  <line x1="56" y1="1168" x2="104" y2="1168" stroke="#1A6B4A" stroke-width="1.1"/>
  <line x1="64" y1="1174" x2="96" y2="1174" stroke="#6E3548" stroke-width="0.9"/>
</svg>
