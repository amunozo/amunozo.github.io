---
layout: default
---

<article class="post-article">
  <header class="post-header">
    <p class="section-kicker">Blog</p>
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
    {% if page.excerpt %}
    <p class="post-deck">{{ page.excerpt }}</p>
    {% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
