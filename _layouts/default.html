<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Google Analytics 4 (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LSS8FOX3PE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-LSS8FOX3PE');
  </script>
</head>

<body class="{% if page.permalink == '/' %}page-home{% endif %}{% if page.permalink == '/research/' %} page-research{% endif %}">
  <div class="page-ornament page-ornament--top-left" aria-hidden="true"></div>
  <div class="page-ornament page-ornament--top-right" aria-hidden="true"></div>
  <div class="page-ornament page-ornament--bottom-left" aria-hidden="true"></div>
  <div class="page-ornament page-ornament--bottom-right" aria-hidden="true"></div>
  <div class="site-shell">
    {% include header.html %}
    <main class="page-content">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
</body>

</html>
